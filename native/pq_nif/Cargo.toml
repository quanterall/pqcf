[package]
name = "pq_nif"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "0.36"
rand_core = "0.9"
rand_chacha = "0.9"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# Phase 4: the CUDA driver API opened at run time (src/gpu.rs); no CUDA needed to build
libloading = "0.8"

[profile.release]
opt-level = 3
debug = false

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
