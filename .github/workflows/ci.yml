# The full suite in the dev container on both supported targets (NFR-11): EUnit (property, statistical and
# distributed tests), Dialyzer, xref, cargo test, clippy. Weekly and on demand: the sanitizer runs (FS 12.6).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  suite:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image
        run: docker build -t pqcf-dev .
      - name: Run the suite
        # failures also become annotations, which anyone can read (the job log needs a GitHub login)
        run: |
          set -o pipefail
          docker run --rm pqcf-dev 2>&1 | tee suite.log || {
            # one annotation with the failures and their context (a step shows at most 10 annotations)
            msg=$(sed 's/\x1b\[[0-9;]*m//g' suite.log \
                  | grep -E -A12 '^ +[0-9]+\) |Line [0-9]+|test result: FAILED|^error' | head -80 \
                  | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Failing tests::$msg"
            exit 1; }

  sanitize:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests under AddressSanitizer
        run: sh tools/sanitize.sh
